<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miasta i herby</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 30px;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 70%;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            border: 1px solid black;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #dddddd;
        }

        img {
            width: 150px;
            height: 150px;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <h1>Miasta i herby</h1>

    <table>
        <tr>
            <th>Miasto</th>
            <th>Herb</th>
        </tr>
        <tr>
            <td>Wieliczka</td>
            <td><img src="wieliczka.webp" alt="Herb Wieliczki"></td>
        </tr>
        <tr>
            <td>Świętochłowice</td>
            <td><img src="swietochlowice.webp" alt="Herb Świętochłowic"></td>
        </tr>
        <tr>
            <td>Chorzów</td>
            <td><img src="chorzow.webp" alt="Herb Chorzowa"></td>
        </tr>
        <tr>
            <td>Katowice</td>
            <td><img src="katowice.webp" alt="Herb Katowic"></td>
        </tr>
    </table>

</body>
</html>
